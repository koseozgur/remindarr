services:
  remindarr:
    build: .
    image: remindarr:latest
    container_name: remindarr
    restart: unless-stopped

    env_file: .env

    environment:
      # Absolute path -- note the four slashes after the scheme.
      REMINDARR_DATABASE_URL: sqlite+aiosqlite:////data/remindarr.db

    volumes:
      # Bind mount rather than a named volume so the database is a file you can
      # see, copy, and back up with the rest of the homelab.
      - ./data:/data

    # Not published by default, deliberately: Telegram and Discord connect
    # outbound. LINE needs its webhook reachable over public HTTPS; how (a
    # reverse proxy on this network, a tunnel, a port on the host) is your
    # call. To publish it on the host, uncomment:
    # ports:
    #   - "8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
