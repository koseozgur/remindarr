[project]
name = "remindarr"
version = "0.1.0"
description = "Self-hosted, chat-native reminders. Capture and delivery as separate pluggable adapters."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "python-telegram-bot==22.8",
    "discord.py==2.7.1",
    # The [asyncio] extra pulls in greenlet, without which every async DB call
    # raises at runtime -- not just in tests.
    "sqlalchemy[asyncio]==2.1.8",
    "aiosqlite==0.22.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "tzdata==2026.6",
]

[project.scripts]
remindarr = "remindarr.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remindarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
# Teaches mypy pydantic's real constructor semantics -- e.g. that Settings
# accepts _env_file and coerces a str into a SecretStr.
plugins = ["pydantic.mypy"]
