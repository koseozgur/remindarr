name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv stopped publishing floating major tags
        # after v7, so "@v10" does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml, so a
        # lockfile someone forgot to regenerate breaks CI instead of silently
        # installing something other than what is pinned.
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: remindarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # With no tokens configured the app must exit 2 with a clear message
        # rather than crashing or hanging. That exercises config loading and
        # the entrypoint without needing real credentials.
        run: |
          set +e
          output=$(docker run --rm remindarr:ci 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit code 2, got $code"
            exit 1
          fi
          echo "$output" | grep -q "No platform tokens set" || {
            echo "::error::missing expected startup message"
            exit 1
          }
